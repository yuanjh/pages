<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTML 页面发布站</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f0f2f5; color: #1a1a2e;
    min-height: 100vh; padding: 0;
  }
  .header {
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    color: #fff; padding: 48px 0 40px; text-align: center;
  }
  .header h1 { font-size: 32px; font-weight: 700; letter-spacing: 0.02em; }
  .header p { font-size: 15px; opacity: 0.75; margin-top: 8px; }
  .container { max-width: 900px; margin: -24px auto 40px; padding: 0 24px; position: relative; z-index: 1; }

  .category {
    background: #fff; border-radius: 12px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    margin-bottom: 20px; overflow: hidden;
    border: 1px solid #e8e8e8;
  }
  .category-header {
    padding: 16px 24px;
    background: #fafafa;
    border-bottom: 1px solid #eee;
    display: flex; align-items: center; gap: 10px;
    font-size: 16px; font-weight: 600; color: #333;
  }
  .category-header .cat-icon { font-size: 20px; }
  .page-list { padding: 8px 0; }
  .page-item {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 24px;
    text-decoration: none; color: inherit;
    transition: background 0.15s;
    border-bottom: 1px solid #f5f5f5;
  }
  .page-item:last-child { border-bottom: none; }
  .page-item:hover { background: #f7faff; }
  .page-icon {
    width: 42px; height: 42px;
    background: #e8f0fe; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; flex-shrink: 0;
  }
  .page-info { flex: 1; }
  .page-name { font-size: 15px; font-weight: 600; color: #1a1a2e; }
  .page-desc { font-size: 13px; color: #888; margin-top: 2px; }
  .page-arrow { font-size: 18px; color: #ccc; }
  .page-item:hover .page-arrow { color: #4d8cd9; }
  .page-item:hover .page-icon { background: #d0e0fc; }

  .footer {
    text-align: center; padding: 24px;
    font-size: 12px; color: #aaa;
  }
</style>
</head>
<body>

<div class="header">
  <h1>HTML Pages</h1>
  <p>个人 HTML 页面发布站</p>
</div>

<div class="container">

  <!-- 工程脚手架 -->
  <div class="category">
    <div class="category-header">
      <span class="cat-icon">🏗️</span> 工程脚手架平台
    </div>
    <div class="page-list">
      <a class="page-item" href="scaffold/index.html">
        <div class="page-icon">🌐</div>
        <div class="page-info">
          <div class="page-name">脚手架导航页</div>
          <div class="page-desc">Web 版 & IDEA 插件版入口</div>
        </div>
        <span class="page-arrow">›</span>
      </a>
      <a class="page-item" href="scaffold/web.html">
        <div class="page-icon">🖥️</div>
        <div class="page-info">
          <div class="page-name">Web 脚手架 V3.0</div>
          <div class="page-desc">面向 Web 端的工程脚手架配置平台</div>
        </div>
        <span class="page-arrow">›</span>
      </a>
      <a class="page-item" href="scaffold/idea-plugin.html">
        <div class="page-icon">🧩</div>
        <div class="page-info">
          <div class="page-name">IDEA 插件脚手架 V3.0</div>
          <div class="page-desc">模拟 IntelliJ IDEA 插件交互体验</div>
        </div>
        <span class="page-arrow">›</span>
      </a>
    </div>
  </div>

  <!-- 占位：后续新增分类在此插入 -->

</div>

<div class="footer">Last updated: 2026-06-08</div>

</body>
</html>
